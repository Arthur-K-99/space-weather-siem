services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: sws-elasticsearch
    environment:
      - node.name=sws-es01
      - cluster.name=space-weather-siem
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u \"elastic:${ELASTIC_PASSWORD}\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # One-shot: with security on, Kibana must connect as kibana_system (the
  # elastic superuser is rejected), so set that user's password once ES is up.
  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: sws-kibana-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      bash -c 'curl -fsS -u "elastic:${ELASTIC_PASSWORD}" -X POST
      -H "Content-Type: application/json"
      http://elasticsearch:9200/_security/user/kibana_system/_password
      -d "{\"password\":\"${KIBANA_PASSWORD}\"}"
      && echo "kibana_system password set"'
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    container_name: sws-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana-setup:
        condition: service_completed_successfully
    environment:
      - SERVER_NAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      # One key reused for all three so saved-object exports/imports (M6
      # dashboards) survive container recreation. 32+ chars required.
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - TELEMETRY_ENABLED=false
    ports:
      - "5601:5601"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:5601/api/status > /dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # One-shot: apply index templates + ILM before the collector writes, so the
  # data stream is created with our mapping. stdlib-only, so a plain python image
  # with the scripts/ + elastic/ dirs mounted is enough.
  bootstrap:
    image: python:3.12-slim
    container_name: sws-bootstrap
    depends_on:
      elasticsearch:
        condition: service_healthy
    env_file: .env
    environment:
      - ES_URL=http://elasticsearch:9200
    volumes:
      - ./scripts:/app/scripts:ro
      - ./elastic:/app/elastic:ro
    working_dir: /app
    command: python scripts/bootstrap.py
    restart: "no"

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    container_name: sws-collector
    depends_on:
      elasticsearch:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    env_file: .env
    environment:
      # In-network address overrides the host-oriented ES_URL from .env
      - ES_URL=http://elasticsearch:9200
    restart: unless-stopped

volumes:
  esdata:
